[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lightpath"
version = "0.1.0"
description = "LightPath - CLPS Lunar Mission Browser"
authors = [{ name = "LightPath Team" }]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "jsonschema>=4.0.0",
    "spiceypy>=6.0.0",
    "pyyaml>=6.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "requires_kernels: marks tests that require physical SPICE kernels downloaded"
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "web",
    "build",
    "dist",
    "__pycache__"
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

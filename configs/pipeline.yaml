# LightPath Real Pipeline Configuration
# Governed by docs/PROJECT_RULES.md
kernels_meta_path: kernels/meta.tm
dsn_config_path: configs/dsn_stations.yaml

date_range:
  start_utc: "2026-11-01T00:00:00Z"
  end_utc: "2026-12-01T00:00:00Z"

step_minutes: 30
mast_heights_m: [0.0, 2.0, 5.0, 10.0]

thresholds:
  min_sun_frac: 0.50
  min_earth_frac: 0.50
  ground_station_mask_deg: 6.0
  max_slope_deg: 15.0

margins:
  horizon_margin_deg: 0.03

horizon_params:
  az_step_deg: 1.0
  max_range_m: 50000.0
  step_m: 50.0

route_planning:
  half_width_m: 600.0
  spacing_m: 50.0
  step_minutes: 30
  max_cells: 4000

output_dir: web/public/data

sites:
  - id: test-location
    name: "Real terrain test location (not a mission site)"
    lat_deg: -89.50
    lon_deg: 0.00
    ground_elev_m: -721.96
    source_label: "NASA GSFC Planetary Geodesy Data Archive / LOLA 20mpp & 80mpp (Barker et al. 2023)"
    source_url: "https://pgda.gsfc.nasa.gov/products/78"
    retrieved_on: "2026-11-07"
    verified: false
    is_synthetic: false
    is_demo_site: true
    ephemeris_source: "spice_kernels"
    terrain_source: "lola_dem"
    notes: "Real terrain test location (-89.5 deg N, 0.0 deg E) computed with LOLA near (20 m) and far (80 m) nested layers and SPICE DE421 kernels."
    mission_ids: []
    source_links:
      - "https://pgda.gsfc.nasa.gov/products/78"
      - "https://doi.org/10.3847/PSJ/acf3e1"
    terrain_layers:
      - name: "near"
        path: "data/raw/near_test_location.tif"
        max_range_m: 30000.0
        pixel_size_m: 20.0
      - name: "far"
        path: "data/raw/LDEM_80S_80MPP_ADJ.TIF"
        max_range_m: 100000.0
        pixel_size_m: 80.0

  - id: synthetic-proving-ground
    name: "Synthetic Proving Ground (SYNTHETIC EXAMPLE)"
    lat_deg: -89.90
    lon_deg: 0.00
    ground_elev_m: 0.0
    source_label: "Synthetic Crater Proving Ground Model (pipeline/synthetic.py)"
    source_url: "https://github.com/AnmolGarg8/LightPath"
    retrieved_on: "2026-10-29"
    verified: false
    is_synthetic: true
    is_demo_site: false
    ephemeris_source: "spice_kernels"
    terrain_source: "synthetic"
    notes: "Synthetic math-generated crater for algorithm testing and verification."
    mission_ids: ["synthetic-proving-lander"]
    synthetic_feature: crater
    source_links:
      - "synthetic://pipeline.synthetic/crater"
    terrain_layers:
      - name: "fine"
        path: "data/processed/synthetic/dem_crater_fine.tif"
        max_range_m: 5000.0
        pixel_size_m: 10.0
      - name: "medium"
        path: "data/processed/synthetic/dem_crater_medium.tif"
        max_range_m: 30000.0
        pixel_size_m: 50.0

# LightPath Real Pipeline Configuration
# Governed by docs/PROJECT_RULES.md
# Real entries are marked verified: false until official kernels and PDS products are loaded.

kernels_meta_path: kernels/meta.tm
dsn_config_path: configs/dsn_stations.yaml

date_range:
  start_utc: "2026-11-01T00:00:00Z"
  end_utc: "2026-11-15T00:00:00Z"

step_minutes: 60
mast_heights_m: [0.0, 2.0, 5.0, 10.0]

thresholds:
  min_sun_frac: 0.50
  min_earth_frac: 0.50
  ground_station_mask_deg: 6.0
  max_slope_deg: 15.0

margins:
  horizon_margin_deg: 0.10

horizon_params:
  az_step_deg: 1.0
  max_range_m: 50000.0
  step_m: 25.0

route_planning:
  half_width_m: 1000.0
  spacing_m: 50.0
  step_minutes: 120
  max_cells: 4000

output_dir: web/public/data

sites:
  - id: shackleton-connecting-ridge
    name: "Shackleton Connecting Ridge"
    lat_deg: -89.78
    lon_deg: 128.80
    ground_elev_m: 1100.0
    verified: false
    is_synthetic: false
    mission_ids: ["clps-placeholder-shackleton"]
    source_links:
      - "https://pgda.gsfc.nasa.gov/products/78"
    terrain_layers:
      - name: "fine"
        path: "data/raw/lola_shackleton_20m.tif"
        max_range_m: 10000.0
        pixel_size_m: 20.0

  - id: malapert-mountain
    name: "Malapert Mountain"
    lat_deg: -86.04
    lon_deg: 2.70
    ground_elev_m: 5000.0
    verified: false
    is_synthetic: false
    mission_ids: ["clps-placeholder-malapert"]
    source_links:
      - "https://pgda.gsfc.nasa.gov/products/78"
    terrain_layers:
      - name: "fine"
        path: "data/raw/lola_malapert_20m.tif"
        max_range_m: 10000.0
        pixel_size_m: 20.0

  - id: nobile-crater-rim
    name: "Nobile Crater Rim"
    lat_deg: -85.20
    lon_deg: 35.80
    ground_elev_m: 200.0
    verified: false
    is_synthetic: false
    mission_ids: []
    source_links:
      - "https://pgda.gsfc.nasa.gov/products/78"
    terrain_layers:
      - name: "fine"
        path: "data/raw/lola_nobile_20m.tif"
        max_range_m: 10000.0

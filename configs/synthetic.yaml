# LightPath Synthetic Proving Ground Configuration
# Governed by docs/PROJECT_RULES.md
# ALL synthetic sites must carry is_synthetic: true and permanent UI banners.

kernels_meta_path: kernels/meta.tm
dsn_config_path: configs/dsn_stations.yaml

date_range:
  start_utc: "2026-11-01T00:00:00Z"
  end_utc: "2026-11-05T00:00:00Z"

step_minutes: 120
mast_heights_m: [0.0, 2.0, 5.0, 10.0]

thresholds:
  min_sun_frac: 0.50
  min_earth_frac: 0.50
  ground_station_mask_deg: 6.0
  max_slope_deg: 15.0

margins:
  horizon_margin_deg: 0.10

horizon_params:
  az_step_deg: 5.0
  max_range_m: 25000.0
  step_m: 50.0

route_planning:
  half_width_m: 600.0
  spacing_m: 50.0
  step_minutes: 180
  max_cells: 4000

output_dir: web/public/data

sites:
  - id: synthetic-proving-ground
    name: "Synthetic Proving Ground (SYNTHETIC)"
    lat_deg: -89.90
    lon_deg: 0.00
    ground_elev_m: 0.0
    verified: false
    is_synthetic: true
    mission_ids: []
    synthetic_feature: crater
    source_links:
      - "synthetic://pipeline.synthetic/crater"
    terrain_layers:
      - name: "fine"
        path: "data/processed/synthetic/dem_crater_fine.tif"
        max_range_m: 5000.0
        pixel_size_m: 10.0
      - name: "medium"
        path: "data/processed/synthetic/dem_crater_medium.tif"
        max_range_m: 30000.0
        pixel_size_m: 50.0

  - id: synthetic-flat-basin
    name: "Synthetic Flat Basin (SYNTHETIC)"
    lat_deg: -89.95
    lon_deg: 90.00
    ground_elev_m: 100.0
    verified: false
    is_synthetic: true
    mission_ids: []
    synthetic_feature: flat
    source_links:
      - "synthetic://pipeline.synthetic/flat"
    terrain_layers:
      - name: "fine"
        path: "data/processed/synthetic/dem_flat_fine.tif"
        max_range_m: 10000.0
        pixel_size_m: 25.0

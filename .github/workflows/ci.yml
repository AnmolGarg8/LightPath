name: LightPath CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Test & Build (Python & Web)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov jsonschema numpy scipy pydantic pyyaml matplotlib spiceypy rasterio pyproj pyarrow ephem

      - name: Install Web Dependencies
        working-directory: web
        run: npm install

      - name: Python Lint (ruff)
        run: ruff check .

      - name: Claims Guard (Scientific Claims Audit)
        run: python scripts/claims_guard.py

      - name: Web Lint (eslint)
        working-directory: web
        run: npm run lint

      - name: Web Unit Tests (vitest)
        working-directory: web
        run: npm test

      - name: Verify Data Catalog Integrity
        run: python scripts/check_catalog.py

      - name: Verify Terrain Truthfulness
        run: python scripts/check_terrain_truthfulness.py

      - name: Fetch SPICE Kernels
        run: python scripts/fetch_kernels.py

      - name: Python Test Suite (pytest)
        run: pytest -v

      - name: Verify Committed Test Results & Tracked Files Integrity
        run: |
          git diff --exit-code tests/results.json web/public/data/test_results.json
          git diff --exit-code

      - name: Web Static Build (tsc + vite)
        working-directory: web
        run: npm run build

      - name: Install Playwright Browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: E2E Production Smoke Test (Playwright)
        working-directory: web
        run: npm run test:e2e

      - name: Upload E2E Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: web/e2e-screenshots/
          if-no-files-found: ignore

  kernel_free_test:
    name: Kernel-Optional Test Suite (Checkout without SPICE kernels)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies (without kernels)
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov jsonschema numpy scipy pydantic pyyaml matplotlib rasterio pyproj pyarrow ephem spiceypy

      - name: Run Kernel-Free Pytest Suite
        run: pytest -m "not requires_kernels and not network" -v

      - name: Verify Tests Did Not Modify Tracked Files
        run: git diff --exit-code
